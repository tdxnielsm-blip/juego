<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código Noir: Detective de Datos</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fuentes nivel GOD -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <!-- Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Fondo dinámico de partículas -->
    <div id="particles-js"></div>

    <div class="game-wrapper">
        <!-- HUD Glassmorphism -->
        <header class="hud-glass">
            <div class="stat-group">
                <i class="fa-solid fa-city icon-city"></i>
                <div class="stat-info">
                    <span>ESTADO DE LA CIUDAD</span>
                    <div class="bar-bg"><div id="health-bar" class="bar-fill"></div></div>
                </div>
            </div>
            <div class="stat-group score-group">
                <i class="fa-solid fa-star icon-gold"></i>
                <div class="stat-info">
                    <span>REPUTACIÓN</span>
                    <strong id="score">0</strong>
                </div>
            </div>
            <div class="stat-group combo-group">
                <i class="fa-solid fa-fire icon-fire"></i>
                <div class="stat-info">
                    <span>COMBO</span>
                    <strong id="combo">x1</strong>
                </div>
            </div>
        </header>

        <!-- Expediente del Caso -->
        <main id="game-screen" class="mission-card">
            <div class="card-header">
                <span id="level-badge" class="badge">EXPEDIENTE 01</span>
                <i class="fa-solid fa-fingerprint fingerprint-icon"></i>
            </div>
            
            <h2 id="question-text">Analizando la escena del crimen digital...</h2>
            
            <div id="options-container" class="options-layout">
                <!-- Generado por JS -->
            </div>

            <div id="feedback" class="feedback-banner hidden"></div>
        </main>

        <!-- Gadgets de Detective -->
        <footer class="gadgets-panel">
            <button class="gadget-btn" onclick="usePowerup('oracle')">
                <i class="fa-solid fa-eye"></i> Visión de Detective (50/50)
            </button>
            <button class="gadget-btn" onclick="usePowerup('shield')">
                <i class="fa-solid fa-shield-halved"></i> Cortafuegos Táctico
            </button>
        </footer>
    </div>

    <!-- Scripts externos -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
