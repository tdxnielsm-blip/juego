<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Arcade Combat - Ultimate Edition</title>
    <style>
        :root { --blue: #0033cc; --yellow: #ffcc00; --red: #e62e00; --sword1: #00ffff; --bg: #050510; }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            background-color: #000; color: #fff; font-family: 'Courier New', monospace;
            overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column;
        }

        /* EFECTO CRT Y CÁMARA */
        .crt {
            position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 100;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px; opacity: 0.3;
        }
        .camera { width: 100%; height: 100%; position: absolute; transition: transform 0.1s; }
        .shake { animation: camShake 0.3s ease-in-out; }
        @keyframes camShake {
            0%, 100% { transform: translate(0,0); }
            25% { transform: translate(-15px, 10px); }
            75% { transform: translate(15px, -15px); }
        }

        /* INTERFAZ HUD */
        .hud {
            position: relative; z-index: 20; padding: 20px; display: flex; justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.9), transparent); font-weight: bold; font-size: 1.2rem;
        }
        .hp-box { width: 300px; height: 25px; background: #222; border: 3px solid #fff; position: relative; margin-top: 5px; }
        .hp-fill { height: 100%; transition: width 0.3s; }
        .hero-hp { background: #00ff00; }
        .boss-hp { background: #ff0000; float: right; }
        .combo-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: 2rem; color: var(--sword1); text-shadow: 0 0 10px var(--sword1); }

        /* ESCENARIO Y PERSONAJES */
        .arena { flex: 1; position: relative; z-index: 10; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 15% 10% 15%; }
        .fighter { width: 250px; height: 300px; transition: 0.2s; position: relative; }
        
        /* Animaciones CSS del Héroe */
        .hero { filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }
        .hero.idle { animation: breathe 1s infinite alternate; }
        .hero.attack { transform: translateX(30vw) scale(1.1); z-index: 30; }
        .hero.hit { filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); transform: translateX(-20px); }
        
        .boss { width: 350px; height: 350px; }
        .boss.attack { transform: translateX(-30vw) scale(1.05); z-index: 30; }
        .boss.hit { filter: brightness(2) hue-rotate(90deg); transform: translateX(20px); }

        @keyframes breathe { from { transform: scaleY(1); } to { transform: scaleY(0.95) translateY(10px); } }

        /* EFECTOS DE JUICE (Partículas y Cortes) */
        .particle { position: absolute; width: 8px; height: 8px; background: #fff; pointer-events: none; animation: explode 0.5s forwards; z-index: 50; }
        @keyframes explode { to { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
        
        .slash { position: absolute; width: 200px; height: 10px; background: #fff; box-shadow: 0 0 20px var(--sword1); border-radius: 50%; z-index: 60; pointer-events: none; animation: slashAnim 0.2s ease-out forwards; transform-origin: center; }
        @keyframes slashAnim { 0% { transform: scaleX(0) rotate(var(--rot)); opacity: 1; } 100% { transform: scaleX(2) rotate(var(--rot)); opacity: 0; } }

        /* CONTROLES */
        .panel { position: relative; z-index: 20; height: 25vh; background: #111; border-top: 5px solid var(--yellow); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .btn { background: #333; border: 3px solid #555; color: #fff; font-size: 1.5rem; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.1s; }
        .btn:active:not(:disabled) { transform: scale(0.95); background: #555; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ult { grid-column: span 2; background: var(--blue); border-color: var(--sword1); color: var(--sword1); text-shadow: 0 0 10px var(--sword1); }

        /* MODAL PREGUNTAS */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,20,0.9); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 1000; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .m-box { background: var(--blue); border: 5px solid var(--yellow); padding: 30px; width: 90%; max-width: 700px; }
        .m-q { font-size: 1.5rem; margin-bottom: 20px; color: #fff; line-height: 1.3; }
        .opt { background: #fff; border: 3px solid #000; padding: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; width: 100%; text-align: left; margin-bottom: 10px; transition: 0.1s; color: #000; }
        .opt:hover { background: var(--yellow); transform: translate(-5px, -5px); box-shadow: 5px 5px 0 #000; }

        svg { overflow: visible; }
    </style>
</head>
<body>
    <div class="crt"></div>
    <div class="camera" id="cam">
        
        <div class="hud">
            <div>
                <div>MUTANTE CARMESÍ</div>
                <div class="hp-box"><div id="hp-p" class="hp-fill hero-hp" style="width: 100%;"></div></div>
            </div>
            <div id="combo" class="combo-text">NIVEL 1</div>
            <div style="text-align: right;">
                <div id="boss-name">CENTINELA MK-I</div>
                <div class="hp-box"><div id="hp-e" class="hp-fill boss-hp" style="width: 100%;"></div></div>
            </div>
        </div>

        <div class="arena">
            <!-- HÉROE (Animación SVG) -->
            <div id="hero" class="fighter hero idle">
                <svg viewBox="0 0 300 300" width="100%" height="100%">
                    <path d="M 120 180 Q 40 250 20 150 Q 10 100 40 80 L 50 100 Q 30 150 110 200 Z" fill="var(--red)"/> <!-- Cola -->
                    <path d="M 140 180 L 110 260 L 140 260 L 150 200 Z M 160 180 L 180 260 L 210 260 L 180 200 Z" fill="var(--blue)"/> <!-- Piernas -->
                    <path d="M 130 110 Q 120 150 140 190 L 170 190 Q 180 150 170 110 Z" fill="var(--blue)"/> <!-- Torso -->
                    <path d="M 135 70 Q 150 50 175 70 L 170 100 L 140 100 Z" fill="var(--red)"/> <!-- Cabeza -->
                    <!-- Espada -->
                    <g id="arm" style="transform-origin: 160px 120px;">
                        <path d="M 160 120 L 200 150 L 190 180" fill="none" stroke="var(--red)" stroke-width="14"/>
                        <polygon points="190,170 280,100 290,115 200,185" fill="#fff" stroke="var(--sword1)"/>
                    </g>
                </svg>
            </div>

            <!-- JEFE -->
            <div id="boss" class="fighter boss idle">
                <svg viewBox="0 0 400 400" width="100%" height="100%">
                    <path d="M 150 150 L 80 200 L 100 300 L 130 280 Z M 180 100 L 300 100 L 320 280 L 180 280 Z" fill="#660099"/>
                    <path d="M 210 30 L 270 30 L 280 100 L 200 100 Z" fill="#660099"/>
                    <polygon points="220,50 240,55 225,65" fill="var(--yellow)"/>
                    <polygon points="260,50 240,55 255,65" fill="var(--yellow)"/>
                    <circle cx="245" cy="155" r="25" fill="var(--yellow)"/>
                    <path d="M 270 140 L 360 200 L 320 300 L 270 260 Z" fill="#660099"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="panel">
        <button id="btn-atk" class="btn" onclick="playerAttack()">ATAQUE RÁPIDO</button>
        <button id="btn-def" class="btn" onclick="playerDefend()">BLOQUEO</button>
        <button id="btn-ult" class="btn btn-ult" onclick="openTrivia()">SISTEMA CEREBRO (HACKEAR)</button>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="m-box">
            <div class="m-q" id="m-q">Cargando pregunta...</div>
            <div id="m-opts"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. BANCO DE PREGUNTAS COMPLETO (20 PREGUNTAS)
        // ==========================================
        const bancoDePreguntas = [
            { q: "¿Qué significa el acrónimo RAM en informática?", o: ["Random Access Memory", "Read Access Machine", "Run All Media", "Rapid Action Memory"], a: 0 },
            { q: "¿Cuál de estos NO es un lenguaje de programación?", o: ["Python", "Java", "Cobra", "HTML"], a: 3 },
            { q: "¿Cuántos bits conforman un byte?", o: ["4", "8", "16", "32"], a: 1 },
            { q: "¿Qué metal recubre el esqueleto de Wolverine?", o: ["Vibranium", "Adamantium", "Titanio", "Acero Valyrio"], a: 1 },
            { q: "¿Qué significa CPU?", o: ["Central Process Utility", "Computer Personal Unit", "Central Processing Unit", "Control Panel Unit"], a: 2 },
            { q: "¿Cuál es el principal villano histórico de los X-Men?", o: ["Dr. Doom", "Magneto", "Thanos", "Loki"], a: 1 },
            { q: "¿Qué dispositivo se considera hardware de 'entrada'?", o: ["Monitor", "Impresora", "Teclado", "Altavoces"], a: 2 },
            { q: "¿Qué componente es conocido como el 'cerebro' de la computadora?", o: ["El Disco Duro", "La Memoria RAM", "El Procesador (CPU)", "La Tarjeta Madre"], a: 2 },
            { q: "¿Qué tipo de mutante es el Profesor X según su nivel de poder?", o: ["Clase Beta", "Clase Omega", "Clase Alfa", "Clase Gamma"], a: 2 },
            { q: "¿Cuál es la función principal de un Sistema Operativo?", o: ["Proteger contra virus", "Administrar hardware y software", "Crear páginas web", "Aumentar la memoria RAM"], a: 1 },
            { q: "¿Qué etiqueta HTML se usa para insertar una imagen?", o: ["<image>", "<img>", "<pic>", "<src>"], a: 1 },
            { q: "¿Qué mutante tiene la capacidad de controlar el clima?", o: ["Jean Grey", "Storm (Tormenta)", "Rogue (Titania)", "Mystique"], a: 1 },
            { q: "¿Qué significa SSD en almacenamiento web/físico?", o: ["Solid State Drive", "Super Speed Disk", "System Storage Device", "Secure Save Drive"], a: 0 },
            { q: "¿Qué lenguaje se utiliza principalmente para darle estilos y diseño a una página web?", o: ["JavaScript", "HTML", "CSS", "PHP"], a: 2 },
            { q: "¿Qué es un 'Bucle' o 'Loop' en programación?", o: ["Un error en el código", "Una secuencia que se repite", "Un tipo de variable", "Un ataque cibernético"], a: 1 },
            { q: "¿Cómo se llama el cuarto de entrenamiento holográfico de los X-Men?", o: ["Sala de Peligro", "Habitación del Tiempo", "Cerebro", "El Domo"], a: 0 },
            { q: "¿Qué puerto por defecto utiliza el protocolo HTTP?", o: ["443", "21", "80", "8080"], a: 2 },
            { q: "En bases de datos, ¿Qué significa SQL?", o: ["Structured Query Language", "Simple Question List", "System Quality Level", "Standard Query Logic"], a: 0 },
            { q: "¿Cuál es el atajo de teclado universal para 'Copiar' en Windows?", o: ["Ctrl + X", "Ctrl + C", "Ctrl + V", "Ctrl + Z"], a: 1 },
            { q: "Si una variable es de tipo 'Boolean', ¿Qué valores puede tener?", o: ["Cualquier número", "Texto y números", "Solo Verdadero o Falso", "Valores decimales"], a: 2 }
        ];

        // ==========================================
        // 2. CONFIGURACIÓN DEL JUEGO
        // ==========================================
        const bosses = [
            { name: "CENTINELA MK-I", hp: 300, dmg: 20 },
            { name: "MASTER MOLD", hp: 500, dmg: 35 },
            { name: "NIMROD DEFINITIVO", hp: 800, dmg: 50 }
        ];

        let state = { pHP: 200, maxPHP: 200, eHP: 300, maxEHP: 300, lvl: 0, combo: 0, def: false };
        let currentQuestion = null;
        let askedQuestions = []; // Para no repetir preguntas

        function updateUI() {
            document.getElementById('hp-p').style.width = Math.max(0, (state.pHP / state.maxPHP) * 100) + '%';
            document.getElementById('hp-e').style.width = Math.max(0, (state.eHP / state.maxEHP) * 100) + '%';
            document.getElementById('combo').innerText = state.combo > 1 ? `COMBO x${state.combo}` : `NIVEL ${state.lvl + 1}`;
        }

        // ==========================================
        // 3. EFECTOS ESPECIALES (JUICE)
        // ==========================================
        function camShake() {
            const cam = document.getElementById('cam');
            cam.classList.add('shake');
            setTimeout(() => cam.classList.remove('shake'), 300);
        }

        function createParticles(targetId, color) {
            const el = document.getElementById(targetId);
            const rect = el.getBoundingClientRect();
            for(let i=0; i<15; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.background = color;
                p.style.left = (rect.left + rect.width/2) + 'px';
                p.style.top = (rect.top + rect.height/2) + 'px';
                p.style.setProperty('--tx', (Math.random()-0.5)*200 + 'px');
                p.style.setProperty('--ty', (Math.random()-0.5)*200 + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 500);
            }
        }

        function createSlash(targetId, deg) {
            const el = document.getElementById(targetId);
            const rect = el.getBoundingClientRect();
            const slash = document.createElement('div');
            slash.className = 'slash';
            slash.style.setProperty('--rot', `${deg}deg`);
            slash.style.left = (rect.left + rect.width/2 - 100) + 'px';
            slash.style.top = (rect.top + rect.height/2) + 'px';
            document.body.appendChild(slash);
            setTimeout(() => slash.remove(), 250);
        }

        // ==========================================
        // 4. SISTEMA DE COMBATE
        // ==========================================
        function toggleBtns(active) {
            document.querySelectorAll('.btn').forEach(b => b.disabled = !active);
        }

        function playerAttack() {
            toggleBtns(false);
            state.def = false;
            const hero = document.getElementById('hero');
            hero.classList.add('attack');

            setTimeout(() => {
                camShake();
                createSlash('boss', Math.random()*60 - 30);
                createParticles('boss', '#fff');
                
                let dmg = 15 + (state.combo * 5);
                state.eHP -= dmg;
                state.combo++;
                
                document.getElementById('boss').classList.add('hit');
                updateUI();

                setTimeout(() => {
                    hero.classList.remove('attack');
                    document.getElementById('boss').classList.remove('hit');
                    checkState(bossTurn);
                }, 300);
            }, 200);
        }

        function playerDefend() {
            state.def = true;
            state.combo = 0;
            updateUI();
            toggleBtns(false);
            setTimeout(bossTurn, 500);
        }

        function bossTurn() {
            const boss = document.getElementById('boss');
            boss.classList.add('attack');

            setTimeout(() => {
                camShake();
                createParticles('hero', '#ff0000');
                
                let dmg = bosses[state.lvl].dmg;
                if(state.def) dmg = Math.floor(dmg * 0.2); // Reduce daño al defender
                
                state.pHP -= dmg;
                document.getElementById('hero').classList.add('hit');
                updateUI();

                setTimeout(() => {
                    boss.classList.remove('attack');
                    document.getElementById('hero').classList.remove('hit');
                    checkState(() => toggleBtns(true));
                }, 300);
            }, 200);
        }

        // ==========================================
        // 5. SISTEMA CEREBRO (PREGUNTAS DINÁMICAS)
        // ==========================================
        function openTrivia() {
            // Filtrar preguntas que no se han hecho
            let preguntasDisponibles = bancoDePreguntas.filter(p => !askedQuestions.includes(p.q));
            
            if(preguntasDisponibles.length === 0) {
                alert("¡Has agotado todas las preguntas del sistema! Reiniciando banco de datos...");
                askedQuestions = []; // Reinicia si ya se hicieron todas
                preguntasDisponibles = bancoDePreguntas;
            }

            const randomIndex = Math.floor(Math.random() * preguntasDisponibles.length);
            currentQuestion = preguntasDisponibles[randomIndex];
            askedQuestions.push(currentQuestion.q); // Guardar para no repetir

            document.getElementById('m-q').innerText = currentQuestion.q;
            const optsContainer = document.getElementById('m-opts');
            optsContainer.innerHTML = '';
            
            currentQuestion.o.forEach((opcion, i) => {
                const btn = document.createElement('button');
                btn.className = 'opt';
                btn.innerText = opcion;
                btn.onclick = () => answerTrivia(i);
                optsContainer.appendChild(btn);
            });

            document.getElementById('modal').classList.add('active');
        }

        function answerTrivia(selectedIndex) {
            document.getElementById('modal').classList.remove('active');
            toggleBtns(false);

            if(selectedIndex === currentQuestion.a) {
                // RESPUESTA CORRECTA: ATAQUE ESPECIAL
                camShake();
                document.body.style.filter = "invert(1)";
                
                setTimeout(() => {
                    document.body.style.filter = "none";
                    camShake();
                    createSlash('boss', 45); createSlash('boss', -45); createSlash('boss', 0);
                    createParticles('boss', '#00ffff');
                    
                    state.eHP -= 150; // Daño masivo
                    state.combo += 3;
                    document.getElementById('boss').classList.add('hit');
                    updateUI();
                    
                    setTimeout(() => {
                        document.getElementById('boss').classList.remove('hit');
                        checkState(() => toggleBtns(true));
                    }, 500);
                }, 300);

            } else {
                // RESPUESTA INCORRECTA: PENALIZACIÓN
                state.pHP -= 40;
                state.combo = 0;
                camShake();
                createParticles('hero', '#ff0000');
                document.getElementById('hero').classList.add('hit');
                updateUI();
                
                setTimeout(() => {
                    document.getElementById('hero').classList.remove('hit');
                    checkState(bossTurn); // El jefe ataca
                }, 500);
            }
        }

        // ==========================================
        // 6. GESTIÓN DE NIVELES
        // ==========================================
        function checkState(nextAction) {
            if(state.eHP <= 0) {
                state.lvl++;
                if(state.lvl >= bosses.length) {
                    alert("¡SIMULACIÓN COMPLETADA! ERES UN X-MAN.");
                    location.reload();
                } else {
                    alert("¡ENEMIGO DESTRUIDO! Preparando siguiente nivel...");
                    document.getElementById('boss-name').innerText = bosses[state.lvl].name;
                    state.eHP = bosses[state.lvl].hp;
                    state.maxEHP = bosses[state.lvl].hp;
                    state.pHP = state.maxPHP; // Curar al héroe
                    updateUI();
                    toggleBtns(true);
                }
            } else if (state.pHP <= 0) {
                alert("SISTEMA CRÍTICO. HAS CAÍDO. Fin del juego.");
                location.reload();
            } else {
                if(nextAction) nextAction();
            }
        }
    </script>
</body>
</html>
