<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia X: Detectives Mutantes</title>
    
    <!-- Fuentes Sci-Fi y de Cómic -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Paleta inspirada en los X-Men (Azul y Oro) */
            --x-blue: #0952a5;
            --x-blue-dark: #052a5c;
            --x-gold: #feca2f;
            --x-gold-dark: #cc9b14;
            --x-red: #d32f2f;
            --bg-dark: #0a0e17;
            --panel-bg: rgba(10, 20, 35, 0.85);
            
            --font-title: 'Bangers', cursive;
            --font-hud: 'Share Tech Mono', monospace;
            --font-body: 'Rajdhani', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: var(--font-body);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(9, 82, 165, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(9, 82, 165, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .game-boy {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: var(--panel-bg);
            border: 3px solid var(--x-blue);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(9, 82, 165, 0.5), inset 0 0 20px rgba(254, 202, 47, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(5px);
        }

        /* --- HEADER / HUD --- */
        .hud {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--x-blue-dark);
            border-bottom: 3px solid var(--x-gold);
            border-radius: 12px 12px 0 0;
        }

        .fighter-stats {
            width: 40%;
        }

        .fighter-name {
            font-family: var(--font-title);
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--x-gold);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .enemy-name { color: var(--x-red); text-align: right; }

        .health-bar-container {
            width: 100%;
            height: 18px;
            background: #222;
            border: 2px solid #555;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .health-bar {
            height: 100%;
            width: 100%;
            transition: width 0.3s ease-out;
        }

        #player-hp-bar { background: linear-gradient(90deg, #00f5d4, #00b4d8); }
        #enemy-hp-bar { background: linear-gradient(90deg, #ff003c, #c0002b); transform-origin: right; float: right; }

        .hp-text {
            font-family: var(--font-hud);
            font-size: 0.85rem;
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0; left: 0;
            line-height: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        /* --- ZONA DE COMBATE --- */
        .battle-arena {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .arena-bg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15rem;
            color: rgba(254, 202, 47, 0.05);
            z-index: 0;
        }

        .battle-log {
            z-index: 1;
            width: 80%;
            height: 150px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--x-blue);
            border-radius: 8px;
            padding: 10px;
            font-family: var(--font-hud);
            font-size: 1.1rem;
            color: #00f5d4;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .log-entry.enemy { color: #ff4d4d; }
        .log-entry.system { color: var(--x-gold); font-style: italic; }
        .log-entry.power { color: #d400ff; font-weight: bold; font-size: 1.2rem; }

        /* Sprites visuales abstractos */
        .combat-visuals {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 20px;
            z-index: 1;
        }

        .sprite {
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 3rem;
            box-shadow: 0 0 20px currentColor;
            transition: transform 0.2s;
        }

        #sprite-player { color: var(--x-blue); background: rgba(9, 82, 165, 0.2); border: 2px solid currentColor; }
        #sprite-enemy { color: var(--x-red); background: rgba(211, 47, 47, 0.2); border: 2px solid currentColor; }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-3px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }

        /* --- PANEL DE ACCIÓN --- */
        .action-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-top: 2px solid var(--x-blue);
        }

        .btn-action {
            background: linear-gradient(135deg, var(--x-blue-dark), var(--x-blue));
            border: 2px solid var(--x-blue);
            color: #fff;
            padding: 15px;
            font-family: var(--font-title);
            font-size: 1.3rem;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 1px 1px 2px #000;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(9, 82, 165, 0.6);
            filter: brightness(1.2);
        }

        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .btn-cerebro {
            grid-column: span 2;
            background: linear-gradient(135deg, #b8860b, var(--x-gold-dark));
            border-color: var(--x-gold);
            color: #000;
            text-shadow: none;
        }

        .btn-mutant-power {
            grid-column: span 2;
            background: linear-gradient(135deg, #7b1fa2, #4a148c);
            border-color: #d500f9;
            color: #fff;
            box-shadow: 0 0 20px rgba(213, 0, 249, 0.5);
            animation: pulse-power 1.5s infinite;
        }

        @keyframes pulse-power {
            0% { box-shadow: 0 0 10px rgba(213, 0, 249, 0.5); }
            50% { box-shadow: 0 0 25px rgba(213, 0, 249, 0.9); }
            100% { box-shadow: 0 0 10px rgba(213, 0, 249, 0.5); }
        }

        /* --- MODAL DE TRIVIA (CEREBRO) --- */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .trivia-box {
            background: #111;
            border: 3px solid var(--x-gold);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(254, 202, 47, 0.3);
            text-align: center;
        }

        .trivia-title {
            font-family: var(--font-title);
            color: var(--x-gold);
            font-size: 2rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .trivia-question {
            font-size: 1.3rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .trivia-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-trivia {
            background: #222;
            border: 1px solid #555;
            color: #ddd;
            padding: 15px;
            font-family: var(--font-body);
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .btn-trivia:hover { background: #333; border-color: var(--x-gold); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-boy">
        <!-- HUD Superior -->
        <header class="hud">
            <div class="fighter-stats">
                <div class="fighter-name"><i class="fa-solid fa-user-ninja"></i> Detective X</div>
                <div class="health-bar-container">
                    <div id="player-hp-bar" class="health-bar" style="width: 100%;"></div>
                    <div id="player-hp-text" class="hp-text">100 / 100</div>
                </div>
            </div>
            
            <div class="fighter-stats">
                <div class="fighter-name enemy-name" id="enemy-name">Centinela Mk.1 <i class="fa-solid fa-robot"></i></div>
                <div class="health-bar-container">
                    <div id="enemy-hp-bar" class="health-bar" style="width: 100%;"></div>
                    <div id="enemy-hp-text" class="hp-text">150 / 150</div>
                </div>
            </div>
        </header>

        <!-- Zona de Combate -->
        <main class="battle-arena">
            <i class="fa-brands fa-x-twitter arena-bg"></i>
            
            <div class="combat-visuals">
                <div id="sprite-player" class="sprite"><i class="fa-solid fa-dna"></i></div>
                <div id="sprite-enemy" class="sprite"><i class="fa-solid fa-crosshairs"></i></div>
            </div>

            <div id="battle-log" class="battle-log">
                <div class="log-entry system">Encuentro iniciado. La ciudad depende de ti.</div>
            </div>
        </main>

        <!-- Panel de Botones -->
        <footer class="action-panel">
            <button id="btn-attack" class="btn-action" onclick="playerAttack(false)"><i class="fa-solid fa-hand-fist"></i> Golpe Cinético</button>
            <button id="btn-defend" class="btn-action" onclick="playerDefend()"><i class="fa-solid fa-shield-halved"></i> Escudo Táctico</button>
            <button id="btn-cerebro" class="btn-action btn-cerebro" onclick="openCerebro()"><i class="fa-solid fa-brain"></i> Acceder a Terminal (Desbloquear Poder)</button>
            <button id="btn-mutant-power" class="btn-action btn-mutant-power hidden" onclick="playerAttack(true)"><i class="fa-solid fa-bolt-lightning"></i> RAYO OMEGA (Poder Mutante)</button>
        </footer>

        <!-- Modal de Trivia / CEREBRO -->
        <div id="cerebro-modal" class="modal-overlay">
            <div class="trivia-box">
                <h2 class="trivia-title"><i class="fa-solid fa-microchip"></i> Interfaz de Deducción</h2>
                <p id="trivia-question" class="trivia-question">Cargando datos del objetivo...</p>
                <div id="trivia-options" class="trivia-options">
                    <!-- Opciones generadas por JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- LÓGICA DEL JUEGO -->
    <script>
        // ESTADO DEL JUEGO
        let player = { hp: 100, maxHp: 100, isDefending: false, powerUnlocked: false };
        let currentLevel = 0;
        let isPlayerTurn = true;

        // BASE DE DATOS DE NIVELES Y VILLANOS
        const levels = [
            {
                enemy: { name: "Centinela Mk.1", hp: 120, maxHp: 120, minDmg: 10, maxDmg: 18, icon: "fa-robot" },
                trivia: {
                    question: "El Centinela escanea firmas genéticas basándose en proteínas. Si un mutante cambia de forma a un ave, ¿qué ocurre?",
                    options: [
                        "El Centinela se apaga por error del sistema.",
                        "El Centinela lo ignora, un ave no es amenaza.",
                        "La firma genética original persiste a nivel celular; el Centinela atacará.",
                        "El Centinela no puede rastrear materia orgánica pequeña."
                    ],
                    correct: 2,
                    powerName: "DESCARGA ELECTROMAGNÉTICA"
                }
            },
            {
                enemy: { name: "Infiltrado Metamorfo", hp: 160, maxHp: 160, minDmg: 15, maxDmg: 25, icon: "fa-masks-theater" },
                trivia: {
                    question: "El asesino ha tomado la forma del alcalde. Físicamente es idéntico, pero ¿qué micro-expresión no puede copiar perfectamente un telépata bajo estrés?",
                    options: [
                        "El color del iris.",
                        "La dilatación de las pupilas ante una pregunta trampa.",
                        "El tono de su voz en los discursos públicos.",
                        "Su altura y peso exacto."
                    ],
                    correct: 1,
                    powerName: "INCURSIÓN TELEPÁTICA"
                }
            },
            {
                enemy: { name: "Mente Maestra (Jefe)", hp: 250, maxHp: 250, minDmg: 20, maxDmg: 35, icon: "fa-chess-king" },
                trivia: {
                    question: "La habitación está llena de ilusiones. Ves 3 bombas, pero el telépata solo pudo materializar físicamente una. ¿Cómo encuentras la real sin poderes?",
                    options: [
                        "Le disparo a todas al mismo tiempo.",
                        "Uso gafas de visión nocturna.",
                        "Lanzo polvo al aire; la real bloqueará las partículas de polvo, las ilusiones no.",
                        "Espero a que el reloj de las ilusiones se desincronice."
                    ],
                    correct: 2,
                    powerName: "DESTRUCCIÓN ABSOLUTA (NIVEL OMEGA)"
                }
            }
        ];

        let enemy = null;

        // INICIALIZACIÓN
        function initLevel() {
            if (currentLevel >= levels.length) {
                logMessage("¡Has derrotado a todos los objetivos! La ciudad está a salvo.", "system");
                document.querySelector('.action-panel').innerHTML = `<button class="btn-action btn-cerebro" onclick="location.reload()">Jugar de Nuevo</button>`;
                return;
            }

            enemy = JSON.parse(JSON.stringify(levels[currentLevel].enemy)); // Clon profundo
            player.hp = player.maxHp;
            player.powerUnlocked = false;
            
            document.getElementById('enemy-name').innerHTML = `${enemy.name} <i class="fa-solid ${enemy.icon}"></i>`;
            document.getElementById('sprite-enemy').innerHTML = `<i class="fa-solid ${enemy.icon}"></i>`;
            
            updateHUD();
            resetButtons();
            logMessage(`--- INICIANDO EXPEDIENTE: ${enemy.name} ---`, "system");
        }

        // ACTUALIZAR INTERFAZ
        function updateHUD() {
            // Player
            const pPct = Math.max(0, (player.hp / player.maxHp) * 100);
            document.getElementById('player-hp-bar').style.width = pPct + '%';
            document.getElementById('player-hp-text').innerText = `${Math.max(0, player.hp)} / ${player.maxHp}`;

            // Enemy
            const ePct = Math.max(0, (enemy.hp / enemy.maxHp) * 100);
            document.getElementById('enemy-hp-bar').style.width = ePct + '%';
            document.getElementById('enemy-hp-text').innerText = `${Math.max(0, enemy.hp)} / ${enemy.maxHp}`;
        }

        function logMessage(text, type = "normal") {
            const log = document.getElementById('battle-log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = `> ${text}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight; // Autoscroll
        }

        function shakeElement(id) {
            const el = document.getElementById(id);
            el.classList.remove('shake');
            void el.offsetWidth; // Trigger reflow
            el.classList.add('shake');
        }

        // ACCIONES DEL JUGADOR
        function setTurnState(isPlayer) {
            isPlayerTurn = isPlayer;
            const buttons = document.querySelectorAll('.btn-action');
            buttons.forEach(b => b.disabled = !isPlayer);
        }

        function playerAttack(usePower) {
            if (!isPlayerTurn) return;
            setTurnState(false);
            player.isDefending = false;

            let dmg = Math.floor(Math.random() * (15 - 10 + 1)) + 10; // Ataque básico: 10-15 dmg
            let logTxt = "Atacas con Golpe Cinético.";

            if (usePower && player.powerUnlocked) {
                dmg = Math.floor(Math.random() * (60 - 45 + 1)) + 45; // Nivel Omega: 45-60 dmg
                logTxt = `¡LIBERAS TU PODER MUTANTE!`;
                logMessage(logTxt, "power");
                
                // Consumir el poder tras usarlo
                player.powerUnlocked = false;
                resetButtons();
            } else {
                logMessage(`${logTxt} Causa ${dmg} de daño.`);
            }

            enemy.hp -= dmg;
            shakeElement('sprite-enemy');
            updateHUD();

            if (enemy.hp <= 0) {
                setTimeout(winLevel, 1000);
            } else {
                setTimeout(enemyTurn, 1500);
            }
        }

        function playerDefend() {
            if (!isPlayerTurn) return;
            setTurnState(false);
            
            player.isDefending = true;
            logMessage("Levantas un Escudo Táctico. Daño recibido se reducirá al 50%.", "system");
            
            setTimeout(enemyTurn, 1000);
        }

        // TURNO DEL ENEMIGO
        function enemyTurn() {
            let dmg = Math.floor(Math.random() * (enemy.maxDmg - enemy.minDmg + 1)) + enemy.minDmg;
            
            if (player.isDefending) {
                dmg = Math.floor(dmg / 2);
                player.isDefending = false; // Resetear defensa
                logMessage(`¡Bloqueaste parte del ataque!`, "system");
            }

            logMessage(`${enemy.name} ataca causando ${dmg} de daño.`, "enemy");
            player.hp -= dmg;
            shakeElement('sprite-player');
            updateHUD();

            if (player.hp <= 0) {
                setTimeout(gameOver, 1000);
            } else {
                setTurnState(true);
            }
        }

        // CEREBRO (TRIVIA SYSTEM)
        function openCerebro() {
            if (!isPlayerTurn) return;
            const lvlData = levels[currentLevel].trivia;
            
            document.getElementById('trivia-question').innerText = lvlData.question;
            const optionsContainer = document.getElementById('trivia-options');
            optionsContainer.innerHTML = '';

            lvlData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-trivia';
                btn.innerText = opt;
                btn.onclick = () => answerTrivia(idx, lvlData.correct, lvlData.powerName);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('cerebro-modal').classList.add('active');
        }

        function closeCerebro() {
            document.getElementById('cerebro-modal').classList.remove('active');
        }

        function answerTrivia(selectedIndex, correctIndex, powerName) {
            closeCerebro();
            
            if (selectedIndex === correctIndex) {
                logMessage("¡Deducción correcta! Gen Mutante sincronizado.", "system");
                logMessage(`Has desbloqueado: ${powerName}`, "power");
                player.powerUnlocked = true;
                
                // Cambiar botones
                document.getElementById('btn-cerebro').classList.add('hidden');
                const pwrBtn = document.getElementById('btn-mutant-power');
                pwrBtn.classList.remove('hidden');
                pwrBtn.innerHTML = `<i class="fa-solid fa-bolt-lightning"></i> USAR: ${powerName}`;
                
            } else {
                logMessage("Deducción errónea. ¡Sobrecarga neuronal! Pierdes 15 HP.", "enemy");
                player.hp -= 15;
                shakeElement('sprite-player');
                updateHUD();
                
                // Desactiva el botón de cerebro unos turnos (lo simulamos desactivándolo temporalmente)
                document.getElementById('btn-cerebro').disabled = true;
                setTimeout(() => { document.getElementById('btn-cerebro').disabled = false; }, 4000);
                
                if (player.hp <= 0) setTimeout(gameOver, 1000);
            }
        }

        function resetButtons() {
            document.getElementById('btn-cerebro').classList.remove('hidden');
            document.getElementById('btn-mutant-power').classList.add('hidden');
        }

        // FLUJO DEL JUEGO
        function winLevel() {
            logMessage(`¡Objetivo neutralizado!`, "power");
            setTurnState(false);
            
            setTimeout(() => {
                currentLevel++;
                initLevel();
                setTurnState(true);
            }, 3000);
        }

        function gameOver() {
            logMessage("Tus constantes vitales han caído. La misión ha fracasado.", "enemy");
            setTurnState(false);
            document.querySelector('.action-panel').innerHTML = `
                <button class="btn-action btn-cerebro" onclick="location.reload()">
                    <i class="fa-solid fa-skull"></i> Reiniciar Simulación
                </button>
            `;
        }

        // Iniciar el juego
        initLevel();
    </script>
</body>
</html>
