   <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego GFPI-F-135: Batalla de Software</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-purple: #b026ff;
            --neon-gold: #ffb700;
            --neon-red: #ff3333;
            --neon-green: #00ffaa;
            --bg-base: #030508;
            --glass-bg: rgba(10, 15, 25, 0.85);
            --glass-border: rgba(0, 240, 255, 0.3);
            --font-display: 'Orbitron', sans-serif;
            --font-ui: 'Rajdhani', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-base); color: #fff;
            font-family: var(--font-ui); overflow: hidden;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- FONDOS Y EFECTOS --- */
        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        
        .grid-floor {
            position: absolute; bottom: -20vh; left: -50vw; width: 200vw; height: 60vh;
            background: 
                linear-gradient(transparent 0%, rgba(0, 240, 255, 0.3) 2%, transparent 3%),
                linear-gradient(90deg, transparent 0%, rgba(0, 240, 255, 0.3) 2%, transparent 3%);
            background-size: 60px 60px;
            transform: perspective(600px) rotateX(75deg);
            z-index: 1; animation: gridMove 4s linear infinite; opacity: 0.5;
        }
        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 60px; } }

        /* --- CONTENEDOR PRINCIPAL --- */
        .game-wrapper {
            position: relative; z-index: 2;
            width: 100%; max-width: 1200px; height: 95vh;
            display: flex; flex-direction: column;
            border-radius: 15px; box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        /* --- HUD (Barras de Vida) --- */
        .hud {
            display: flex; justify-content: space-between; padding: 20px 40px;
            border-bottom: 2px solid var(--glass-border);
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .fighter { width: 42%; display: flex; flex-direction: column; }
        .enemy-side { align-items: flex-end; text-align: right; }

        .name {
            font-family: var(--font-display); font-size: 1.6rem; color: #fff;
            text-shadow: 0 0 10px var(--neon-blue); margin-bottom: 10px; letter-spacing: 2px;
        }
        .enemy-side .name { text-shadow: 0 0 10px var(--neon-red); }

        .hp-track {
            width: 100%; height: 28px; background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255,255,255,0.2); border-radius: 14px;
            position: relative; overflow: hidden; box-shadow: inset 0 0 15px #000;
        }

        .hp-fill {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-origin: left center; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .player-hp { background: linear-gradient(90deg, #00d2ff, var(--neon-blue)); box-shadow: 0 0 15px var(--neon-blue); }
        .enemy-hp { background: linear-gradient(90deg, #ff0055, var(--neon-red)); transform-origin: right center; box-shadow: 0 0 15px var(--neon-red); }

        .hp-text {
            position: absolute; width: 100%; text-align: center;
            font-size: 1.1rem; font-weight: bold; line-height: 25px; text-shadow: 2px 2px 4px #000; z-index: 2;
        }

        /* --- ARENA Y PERSONAJES --- */
        .arena { flex: 1; position: relative; overflow: hidden; }

        .characters-container {
            position: absolute; top: 50%; left: 0; width: 100%;
            transform: translateY(-50%); display: flex; justify-content: space-between;
            padding: 0 10%; z-index: 3;
        }

        .avatar {
            width: 220px; height: 220px; /* Personajes más grandes */
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5));
        }

        .player-avatar { animation: float 3s ease-in-out infinite; }
        .enemy-avatar { filter: drop-shadow(0 0 20px rgba(255, 51, 51, 0.5)); animation: float 4s ease-in-out infinite reverse; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* Movimiento de combate */
        .dash-right { transform: translateX(45vw) scale(1.2) !important; z-index: 10; }
        .dash-left { transform: translateX(-45vw) scale(1.2) !important; z-index: 10; }
        .ultimate-rise { transform: translateY(-100px) scale(1.4) !important; filter: drop-shadow(0 0 40px var(--neon-purple)); z-index: 10; }
        
        .hit-shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; filter: brightness(2) drop-shadow(0 0 40px red) !important; }
        @keyframes shake { 10%, 90% { transform: translate3d(-15px, 0, 0); } 20%, 80% { transform: translate3d(15px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-20px, 0, 0); } 40%, 60% { transform: translate3d(20px, 0, 0); } }

        /* Efecto Rayo Ultimate */
        .laser-beam {
            position: absolute; top: 50%; left: 25%; height: 50px; width: 0;
            background: linear-gradient(90deg, transparent, #fff, var(--neon-purple));
            box-shadow: 0 0 40px var(--neon-purple), 0 0 80px var(--neon-purple);
            transform: translateY(-50%); z-index: 9; opacity: 0; transition: width 0.2s, opacity 0.2s;
            border-radius: 25px;
        }

        /* Texto de Daño Flotante */
        .dmg-text {
            position: absolute; font-family: var(--font-display); font-size: 4rem;
            font-weight: 800; color: #fff; text-shadow: 0 0 15px red, 4px 4px 0 #000;
            pointer-events: none; animation: floatUpDmg 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; z-index: 20;
        }
        @keyframes floatUpDmg { 0% { opacity: 1; transform: translateY(0) scale(0.5); } 20% { transform: translateY(-50px) scale(1.2); } 100% { opacity: 0; transform: translateY(-150px) scale(1); } }

        /* --- CONTROLES Y LOG --- */
        .controls-wrapper { display: flex; flex-direction: column; z-index: 3; }

        .log-container {
            height: 90px; background: rgba(0,0,0,0.85); border-top: 1px solid var(--glass-border);
            padding: 10px 25px; overflow-y: auto; font-size: 1.2rem; display: flex; flex-direction: column; gap: 5px;
        }
        .log-entry { animation: fadeInLog 0.3s forwards; color: #ddd; }
        @keyframes fadeInLog { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .text-blue { color: var(--neon-blue); font-weight: bold; } 
        .text-red { color: var(--neon-red); font-weight: bold; } 
        .text-purple { color: var(--neon-purple); font-weight: bold; font-size: 1.3rem; }

        .controls {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 25px 40px;
            background: rgba(5, 8, 15, 0.95); border-radius: 0 0 15px 15px;
        }

        .btn {
            background: rgba(0, 0, 0, 0.7); border: 2px solid rgba(255,255,255,0.2);
            color: #fff; padding: 20px; font-family: var(--font-display); font-size: 1.3rem;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
        .btn-atk:hover:not(:disabled) { border-color: var(--neon-blue); box-shadow: 0 0 25px rgba(0,240,255,0.4); transform: translateY(-3px); }
        .btn-def:hover:not(:disabled) { border-color: var(--neon-green); box-shadow: 0 0 25px rgba(0,255,170,0.4); transform: translateY(-3px); }
        
        .btn-cerebro { grid-column: span 2; background: rgba(255, 183, 0, 0.15); border-color: var(--neon-gold); color: var(--neon-gold); }
        .btn-cerebro:hover:not(:disabled) { background: rgba(255, 183, 0, 0.25); box-shadow: 0 0 30px rgba(255,183,0,0.5); transform: scale(1.02); }
        
        .btn-ultimate { grid-column: span 2; background: linear-gradient(90deg, #4a00e0, #8e2de2); border-color: #fff; box-shadow: 0 0 20px rgba(176, 38, 255, 0.8); animation: pulse-ult 1s infinite; font-weight: bold; color: white;}
        @keyframes pulse-ult { 0%, 100% { box-shadow: 0 0 15px rgba(176,38,255,0.6); } 50% { box-shadow: 0 0 40px rgba(176,38,255,1); } }

        /* --- MODAL DE TRIVIA (PREGUNTAS) --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
        }
        .modal.active { opacity: 1; pointer-events: auto; }

        .hologram-panel {
            background: rgba(10, 15, 25, 0.95); border: 2px solid var(--neon-gold);
            border-radius: 15px; padding: 50px; width: 90%; max-width: 900px;
            box-shadow: 0 0 80px rgba(255, 183, 0, 0.3); text-align: center;
        }
        .modal-title { font-family: var(--font-display); color: var(--neon-gold); font-size: 2.5rem; margin-bottom: 25px; }
        .modal-q { font-size: 1.6rem; margin-bottom: 35px; line-height: 1.6; color: #fff; font-weight: bold;}
        
        .opt-grid { display: flex; flex-direction: column; gap: 15px; }
        .opt-btn {
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,183,0,0.5); color: #fff;
            padding: 20px 30px; font-size: 1.3rem; font-family: var(--font-ui); border-radius: 10px;
            cursor: pointer; transition: all 0.2s; text-align: left; line-height: 1.4;
        }
        .opt-btn:hover { background: rgba(255,183,0,0.25); border-color: var(--neon-gold); transform: translateX(15px); }
        .hidden { display: none !important; }
    </style>
</head>
