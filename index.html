<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Guardian: El Ascenso del Hacker-Héroe</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="hero-theme">
    <div class="game-container">
        <!-- HUD Superior: Estado de la Ciudad -->
        <header class="hud">
            <div class="stat-box">
                <span>ENERGÍA DE NEÓN-CITY</span>
                <div class="health-bar-bg"><div id="health-bar" class="health-bar-fill"></div></div>
            </div>
            <div class="stat-box score-box">
                <span>PUNTOS DE HÉROE: <strong id="score">0</strong></span>
            </div>
            <div class="stat-box combo-box">
                <span>COMBO DE CÓDIGO: <strong id="combo">x1</strong></span>
            </div>
        </header>

        <!-- Zona de Combate: Preguntas -->
        <main id="game-screen" class="hero-card">
            <div id="level-badge" class="badge">NIVEL 1</div>
            <h2 id="question-text">Cargando desafío del Dr. Silicio...</h2>
            
            <div id="options-container" class="options-grid">
                <!-- Las opciones se generan dinámicamente -->
            </div>

            <div id="feedback" class="feedback-msg hidden"></div>
        </main>

        <!-- Arsenal de Habilidades (Comodines) -->
        <footer class="powerups">
            <button class="power-btn" onclick="usePowerup('oracle')">🔮 Ciber-Oráculo (50/50)</button>
            <button class="power-btn" onclick="usePowerup('shield')">🛡️ Escudo de Código</button>
        </footer>
    </div>

    <!-- Partículas de fondo (Opcional, para más "god") -->
    <div class="particles" id="particles-js"></div>

    <script src="game.js"></script>
</body>
</html>
