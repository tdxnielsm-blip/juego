<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Men '97 - Arcade Combat</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Teko:wght@600&display=swap" rel="stylesheet">

    <style>
        :root {
            --blue: #0033cc; --yellow: #ffcc00; --red: #e62e00;
            --sword1: #00ffff; --sword2: #ff00ff;
            --bg-dark: #050a1f; --font-ui: 'Teko', sans-serif; --font-comic: 'Bangers', cursive;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            background-color: #000; color: #fff; font-family: var(--font-ui);
            overflow: hidden; width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
        }

        /* EFECTOS DE CÁMARA */
        .camera { width: 100%; height: 100%; position: absolute; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .shake { animation: camShake 0.4s ease-in-out; }
        .zoom-in { transform: scale(1.1) translateY(5%); }
        @keyframes camShake {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(-15px, 10px); }
            40% { transform: translate(15px, -15px); }
            60% { transform: translate(-10px, 15px); }
            80% { transform: translate(10px, -10px); }
        }

        /* ESCENARIO: DANGER ROOM 90S */
        .danger-room {
            position: absolute; width: 100%; height: 100%; z-index: 1;
            background: linear-gradient(to bottom, #001133, #000); perspective: 800px;
        }
        .grid {
            position: absolute; bottom: 0; left: -50%; width: 200%; height: 60%;
            background-image: 
                linear-gradient(var(--sword1) 1px, transparent 1px),
                linear-gradient(90deg, var(--sword1) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: rotateX(75deg); opacity: 0.3;
            animation: gridScroll 2s linear infinite;
        }
        @keyframes gridScroll { from { background-position: 0 0; } to { background-position: 0 60px; } }
        
        .hazard {
            position: absolute; bottom: 20%; width: 100%; height: 25px;
            background: repeating-linear-gradient(45deg, var(--yellow), var(--yellow) 20px, #000 20px, #000 40px);
            border-top: 3px solid #000; z-index: 2;
        }

        /* HUD - INTERFAZ DE COMBATE */
        .hud {
            position: relative; z-index: 20; padding: 10px 40px; display: flex; justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.9), transparent);
        }
        .plate { width: 40%; }
        .plate.enemy { text-align: right; }
        .name { font-family: var(--font-comic); font-size: 2.5rem; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; }
        .name.hero { color: var(--yellow); }
        .name.boss { color: #ff3366; }
        .level-badge { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); font-family: var(--font-comic); font-size: 3rem; color: #fff; text-shadow: 0 0 10px var(--blue); }

        /* BARRAS DE VIDA (Con efecto de daño secundario) */
        .hp-box { width: 100%; height: 30px; background: #222; border: 4px solid #000; position: relative; }
        .hp-bg { position: absolute; height: 100%; width: 100%; background: #fff; transition: width 0.6s ease-out; }
        .hp-fill { position: absolute; height: 100%; width: 100%; transition: width 0.2s; }
        .hp-fill.hero { background: #00ff00; }
        .hp-fill.boss { background: #ff0000; right: 0; }
        .plate.enemy .hp-bg { right: 0; }

        /* ARENA Y SPRITES */
        .arena { flex: 1; position: relative; z-index: 10; display: flex; align-items: flex-end; padding-bottom: 22%; }
        
        .fighter { position: absolute; filter: drop-shadow(0 15px 10px rgba(0,0,0,0.8)); transition: all 0.3s; }
        .fighter.p1 { left: 15%; width: 280px; height: 350px; }
        .fighter.p2 { right: 15%; width: 400px; height: 450px; }

        /* ANIMACIONES DE COMBATE (ESTILO SPRITE/KEYFRAME) */
        /* 1. Postura de Combate (Idle) */
        .idle .body { animation: breathe 1.2s steps(4) infinite alternate; transform-origin: bottom; }
        .idle .tail { animation: tailSwish 2s ease-in-out infinite alternate; transform-origin: top left; }
        .idle .arm-f { animation: armBob 1.2s infinite alternate; }

        @keyframes breathe { 0% { transform: scaleY(1); } 100% { transform: scaleY(0.96) translateY(10px); } }
        @keyframes tailSwish { 0% { transform: rotate(0deg); } 100% { transform: rotate(-25deg); } }
        @keyframes armBob { 0% { transform: translateY(0); } 100% { transform: translateY(4px); } }

        /* 2. Animación de Ataque (Dash y Slash) */
        .atk-dash { transform: translateX(35vw) scale(1.1); z-index: 30; }
        .atk-dash .arm-f { transform: rotate(45deg) translate(20px, -20px); transition: 0.1s; }
        .atk-dash .sword-f { filter: drop-shadow(0 0 20px var(--sword1)) brightness(1.5); }
        
        .atk-boss { transform: translateX(-30vw) scale(1.05); z-index: 30; }

        /* 3. Animación de Daño (Hit) */
        .hit { animation: takeDamage 0.3s steps(3); filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5) !important; }
        @keyframes takeDamage { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-20px); } }

        /* EFECTOS VISUALES (CORTES Y NÚMEROS) */
        .slash-fx {
            position: absolute; width: 200px; height: 10px; background: #fff;
            box-shadow: 0 0 20px var(--sword1), 0 0 40px var(--sword2);
            border-radius: 50%; z-index: 50; pointer-events: none;
            animation: slashAnim 0.2s ease-out forwards; transform-origin: center;
        }
        @keyframes slashAnim { 
            0% { transform: scaleX(0) rotate(var(--rot)); opacity: 1; } 
            50% { transform: scaleX(1.5) scaleY(3) rotate(var(--rot)); opacity: 1; } 
            100% { transform: scaleX(2) rotate(var(--rot)); opacity: 0; } 
        }

        .dmg-text {
            position: absolute; font-family: var(--font-comic); font-size: 5rem;
            color: #ffea00; text-shadow: 4px 4px 0 #ff0000, 6px 6px 0 #000;
            z-index: 60; pointer-events: none;
            animation: popText 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popText { 0% { transform: scale(0); opacity:1; } 50% { transform: scale(1.2) translateY(-40px); } 100% { transform: scale(1) translateY(-80px); opacity:0; } }

        /* PANEL DE CONTROL */
        .panel {
            position: relative; z-index: 20; height: 150px; background: var(--blue);
            border-top: 6px solid var(--yellow); display: flex; box-shadow: 0 -10px 20px rgba(0,0,0,0.8);
        }
        .console {
            width: 40%; background: #000; padding: 15px; color: #00ffcc;
            font-size: 1.4rem; border-right: 4px solid var(--yellow);
            display: flex; flex-direction: column; justify-content: flex-end; line-height: 1.2; text-shadow: 1px 1px 0 #000;
        }
        .controls { width: 60%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        
        .btn {
            background: #ddd; border: 3px solid #000; font-family: var(--font-comic); font-size: 2rem;
            color: #000; cursor: pointer; transition: 0.1s; text-transform: uppercase; border-radius: 5px;
            box-shadow: 4px 4px 0 #000;
        }
        .btn:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0px 0px 0 #000; }
        .btn:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }
        
        .btn-atk { background: var(--red); color: #fff; }
        .btn-def { background: var(--yellow); }
        .btn-cer { grid-column: span 2; background: var(--sword1); }
        .btn-ult { grid-column: span 2; background: var(--sword2); color: #fff; border-color: #fff; text-shadow: 2px 2px 0 #000; animation: pulseBtn 1s infinite alternate; }
        @keyframes pulseBtn { from { filter: brightness(1); } to { filter: brightness(1.3); } }

        /* MODAL PREGUNTAS */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,20,0.9); display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.2s; z-index: 100;
        }
        .modal.active { opacity: 1; pointer-events: auto; }
        .m-box { background: var(--blue); border: 5px solid var(--yellow); padding: 40px; width: 90%; max-width: 800px; border-radius: 10px; }
        .m-title { font-family: var(--font-comic); color: var(--yellow); font-size: 3rem; margin-bottom: 15px; text-shadow: 2px 2px 0 #000; }
        .m-q { font-size: 1.8rem; margin-bottom: 20px; line-height: 1.2; }
        .opt { background: #fff; border: 3px solid #000; padding: 15px; font-family: var(--font-ui); font-size: 1.5rem; font-weight: bold; cursor: pointer; width: 100%; text-align: left; margin-bottom: 10px; transition: 0.1s; box-shadow: 3px 3px 0 #000; }
        .opt:hover { background: var(--yellow); transform: translate(-2px, -2px); }
        .hidden { display: none !important; }

        svg { overflow: visible; stroke: #000; stroke-width: 3; stroke-linejoin: round; }
    </style>
</head>
<body>

    <div class="camera" id="cam">
        <div class="danger-room"><div class="grid"></div><div class="hazard"></div></div>

        <div class="hud">
            <div class="plate">
                <div class="name hero">MUTANTE CARMESÍ</div>
                <div class="hp-box"><div id="p-hp-bg" class="hp-bg"></div><div id="p-hp" class="hp-fill hero"></div></div>
            </div>
            <div id="level-txt" class="level-badge">NIVEL 1</div>
            <div class="plate enemy">
                <div id="e-name" class="name boss">CENTINELA MK-I</div>
                <div class="hp-box"><div id="e-hp-bg" class="hp-bg"></div><div id="e-hp" class="hp-fill boss"></div></div>
            </div>
        </div>

        <main class="arena">
            <!-- HÉROE (Joven, delgado, cuernos, cruz, espadas, cola) -->
            <div id="p1" class="fighter p1 idle">
                <svg viewBox="0 0 300 300" width="100%" height="100%">
                    <defs>
                        <filter id="glowC"><feGaussianBlur stdDeviation="4" result="blur" /><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                        <filter id="glowP"><feGaussianBlur stdDeviation="4" result="blur" /><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    </defs>

                    <!-- GRUPO CUERPO PRINCIPAL -->
                    <g class="body">
                        <!-- Cola (Animada independientemente) -->
                        <path class="tail" d="M 120 180 Q 40 250 20 150 Q 10 100 40 80 L 50 100 Q 30 150 110 200 Z" fill="var(--red)"/>
                        
                        <!-- Piernas y Botas -->
                        <path d="M 140 180 L 110 260 L 140 260 L 150 200 Z" fill="var(--blue)"/>
                        <path d="M 110 230 L 140 260 L 110 260 Z" fill="var(--yellow)"/>
                        <path d="M 160 180 L 180 260 L 210 260 L 180 200 Z" fill="var(--blue)"/>
                        <path d="M 180 230 L 210 260 L 180 260 Z" fill="var(--yellow)"/>

                        <!-- Brazo y Espada Trasera (Rosa) -->
                        <path d="M 140 130 L 100 150 L 90 180" fill="none" stroke="var(--red)" stroke-width="12"/>
                        <polygon points="90,170 10,60 25,50 105,160" fill="#fff" stroke="var(--sword2)" filter="url(#glowP)"/>
                        
                        <!-- Torso (Traje X-Men) -->
                        <path d="M 130 110 Q 120 150 140 190 L 170 190 Q 180 150 170 110 Z" fill="var(--blue)"/>
                        <path d="M 130 110 L 170 190 M 170 110 L 140 190" fill="none" stroke="var(--yellow)" stroke-width="8"/>
                        <circle cx="155" cy="150" r="12" fill="var(--red)"/>
                        <path d="M 149 144 L 161 156 M 161 144 L 149 156" fill="none" stroke="#fff" stroke-width="3"/>

                        <!-- Cruz de Oro -->
                        <path d="M 140 100 Q 155 120 165 100" fill="none" stroke="#ffcc00" stroke-width="2"/>
                        <rect x="152" y="115" width="4" height="12" fill="#ffcc00" stroke="none"/>
                        <rect x="148" y="119" width="12" height="4" fill="#ffcc00" stroke="none"/>

                        <!-- Cabeza, Cuernos y Ojos -->
                        <path d="M 135 70 Q 150 50 175 70 L 170 100 L 140 100 Z" fill="var(--red)"/>
                        <path d="M 140 65 L 120 30 L 150 55 Z" fill="#ddd"/>
                        <path d="M 170 65 L 190 30 L 160 55 Z" fill="#ddd"/>
                        <!-- Ojos blancos -->
                        <polygon points="142,78 152,82 145,85" fill="#fff" stroke="none"/>
                        <polygon points="168,78 158,82 165,85" fill="#fff" stroke="none"/>
                    </g>

                    <!-- GRUPO BRAZO DELANTERO (Se mueve al atacar) -->
                    <g class="arm-f" style="transform-origin: 160px 120px;">
                        <path d="M 160 120 L 200 150 L 190 180" fill="none" stroke="var(--red)" stroke-width="14"/>
                        <!-- Espada Frontal (Cyan) -->
                        <polygon class="sword-f" points="190,170 280,100 290,115 200,185" fill="#fff" stroke="var(--sword1)" filter="url(#glowC)"/>
                        <circle cx="195" cy="180" r="10" fill="var(--red)"/>
                    </g>
                </svg>
            </div>

            <!-- VILLANO -->
            <div id="p2" class="fighter p2 idle">
                <svg viewBox="0 0 400 400" width="100%" height="100%">
                    <g class="body">
                        <!-- Cuerpo -->
                        <path d="M 150 150 L 80 200 L 100 300 L 130 280 Z" fill="#660099"/>
                        <path d="M 180 100 L 300 100 L 320 280 L 180 280 Z" fill="#660099"/>
                        <path d="M 190 120 L 290 120 L 300 180 L 190 190 Z" fill="#cc0066"/>
                        <circle cx="245" cy="155" r="25" fill="var(--yellow)"/>
                        <!-- Cabeza -->
                        <path d="M 210 30 L 270 30 L 280 100 L 200 100 Z" fill="#660099"/>
                        <path d="M 205 75 L 285 75 L 275 110 L 215 110 Z" fill="#cc0066"/>
                        <polygon points="220,50 240,55 225,65" fill="var(--yellow)"/>
                        <polygon points="260,50 240,55 255,65" fill="var(--yellow)"/>
                        <!-- Brazo Frontal -->
                        <path d="M 270 140 L 360 200 L 320 300 L 270 260 Z" fill="#660099"/>
                        <rect x="290" y="280" width="60" height="60" rx="10" fill="#cc0066"/>
                    </g>
                </svg>
            </div>
        </main>
    </div>

    <!-- CONTROLES -->
    <div class="panel">
        <div class="console" id="log">
            <div>INICIANDO SIMULACIÓN...</div>
        </div>
        <div class="controls">
            <button id="btn-atk" class="btn btn-atk" onclick="action('atk')">Atacar</button>
            <button id="btn-def" class="btn btn-def" onclick="action('def')">Bloquear</button>
            <button id="btn-cer" class="btn btn-cer" onclick="openTrivia()">SISTEMA CEREBRO</button>
            <button id="btn-ult" class="btn btn-ult hidden" onclick="action('ult')">¡JUICIO CARMESÍ!</button>
        </div>
    </div>

    <!-- MODAL DE PREGUNTAS -->
    <div class="modal" id="modal">
        <div class="m-box">
            <h2 class="m-title">ENLACE NEURAL (GFPI)</h2>
            <p class="m-q" id="m-q">Pregunta...</p>
            <div id="m-opts"></div>
        </div>
    </div>

    <script>
        // --- BASE DE DATOS DEL JUEGO ---
        const MAX_HP = 300;
        let p = { hp: MAX_HP, def: false, ult: false };
        let lvl = 0;
        let turn = true; // true = jugador, false = IA

        const levels = [
            { n: "CENTINELA DE HARDWARE", hp: 300, dmg: [20, 35],
              q: "¿Cuál es la definición correcta de Software?", 
              o: ["Componentes físicos.", "Conjunto de programas y reglas.", "El teclado y ratón.", "Sistema de enfriamiento."], a: 1 },
            { n: "MASTER MOLD", hp: 500, dmg: [35, 50],
              q: "¿Qué es una Licencia de Software?", 
              o: ["Un contrato legal de uso y distribución.", "Un virus.", "Un pago obligatorio.", "Una pieza de hardware."], a: 0 },
            { n: "OMEGA SENTINEL", hp: 700, dmg: [45, 65],
              q: "Los dos tipos principales de licencias son:", 
              o: ["Rápidas y lentas.", "Libres (abiertas) y Propietarias (cerradas).", "Windows y Mac.", "Físicas y Virtuales."], a: 1 },
            { n: "NIMROD DEFINITIVO", hp: 1000, dmg: [60, 90],
              q: "¿Qué tipo de licencia debes usar para que todos puedan colaborar libremente?", 
              o: ["Software Propietario.", "Ninguna.", "Software Libre (Ej. GNU GPL).", "Licencia Comercial Restrictiva."], a: 2 }
        ];

        let boss = null;

        // --- SISTEMA VISUAL ---
        function updateUI() {
            document.getElementById('p-hp').style.width = `${Math.max(0, p.hp/MAX_HP)*100}%`;
            setTimeout(() => document.getElementById('p-hp-bg').style.width = `${Math.max(0, p.hp/MAX_HP)*100}%`, 300);
            
            document.getElementById('e-hp').style.width = `${Math.max(0, boss.hp/boss.mhp)*100}%`;
            setTimeout(() => document.getElementById('e-hp-bg').style.width = `${Math.max(0, boss.hp/boss.mhp)*100}%`, 300);
        }

        function logMsg(msg) {
            const b = document.getElementById('log');
            b.innerHTML += `<div>> ${msg}</div>`;
            if (b.children.length > 4) b.removeChild(b.firstChild);
        }

        function setBtns(active) {
            document.querySelectorAll('.btn').forEach(b => b.disabled = !active);
            document.getElementById('btn-cer').classList.toggle('hidden', p.ult);
            document.getElementById('btn-ult').classList.toggle('hidden', !p.ult);
        }

        // --- EFECTOS VISUALES AVANZADOS ---
        function spawnSlash(targetId, deg) {
            const el = document.getElementById(targetId);
            const rect = el.getBoundingClientRect();
            const slash = document.createElement('div');
            slash.className = 'slash-fx';
            slash.style.setProperty('--rot', `${deg}deg`);
            slash.style.left = `${rect.left + rect.width/2 - 100}px`;
            slash.style.top = `${rect.top + rect.height/2}px`;
            document.body.appendChild(slash);
            setTimeout(() => slash.remove(), 250);
        }

        function spawnDmg(targetId, dmg) {
            const el = document.getElementById(targetId);
            const rect = el.getBoundingClientRect();
            const txt = document.createElement('div');
            txt.className = 'dmg-text'; txt.innerText = dmg;
            txt.style.left = `${rect.left + rect.width/3}px`;
            txt.style.top = `${rect.top + rect.height/3}px`;
            document.body.appendChild(txt);
            setTimeout(() => txt.remove(), 800);
        }

        function cameraFx(type) {
            const c = document.getElementById('cam');
            c.classList.add(type);
            setTimeout(() => c.classList.remove(type), type === 'shake' ? 400 : 800);
        }

        // --- LÓGICA DE COMBATE ---
        function initLevel() {
            if(lvl >= levels.length) {
                logMsg("SIMULACIÓN SUPERADA. ERES UN X-MAN.");
                document.querySelector('.controls').innerHTML = `<button class="btn btn-ult" onclick="location.reload()">REINICIAR</button>`;
                return;
            }
            boss = JSON.parse(JSON.stringify(levels[lvl])); boss.mhp = boss.hp;
            document.getElementById('e-name').innerText = boss.n;
            document.getElementById('level-txt').innerText = `NIVEL ${lvl + 1}`;
            p.hp = MAX_HP; p.ult = false; turn = true;
            updateUI(); setBtns(true);
            logMsg(`SALA CONFIGURADA: ${boss.n}`);
        }

        function action(type) {
            if(!turn) return;
            turn = false; setBtns(false);
            
            if(type === 'def') {
                p.def = true;
                logMsg("Postura defensiva lista. Esperando impacto.");
                setTimeout(bossTurn, 800);
            } 
            else if (type === 'atk') {
                p.def = false;
                const p1 = document.getElementById('p1');
                p1.classList.add('atk-dash'); // Animación de Dash
                
                setTimeout(() => {
                    // Impacto
                    cameraFx('shake');
                    spawnSlash('p2', Math.random()*60 - 30);
                    let d = Math.floor(Math.random() * 25) + 35;
                    boss.hp -= d;
                    spawnDmg('p2', d);
                    document.getElementById('p2').classList.add('hit');
                    updateUI();
                    logMsg(`¡Corte doble! Daño: ${d}`);

                    setTimeout(() => {
                        p1.classList.remove('atk-dash');
                        document.getElementById('p2').classList.remove('hit');
                        setTimeout(checkState, 400);
                    }, 300); // Retroceso
                }, 200); // Tiempo que tarda el dash
            }
            else if (type === 'ult') {
                p.def = false; p.ult = false;
                cameraFx('zoom-in');
                document.body.style.filter = "invert(1) hue-rotate(180deg)";
                logMsg("¡PODER MUTANTE LIBERADO!");
                
                setTimeout(() => {
                    cameraFx('shake');
                    // Múltiples cortes
                    spawnSlash('p2', 45); spawnSlash('p2', -45); spawnSlash('p2', 0);
                    let d = Math.floor(Math.random() * 100) + 200;
                    boss.hp -= d;
                    spawnDmg('p2', "CRÍTICO!");
                    document.getElementById('p2').classList.add('hit');
                    updateUI();
                    
                    setTimeout(() => {
                        document.body.style.filter = "none";
                        document.getElementById('p2').classList.remove('hit');
                        setTimeout(checkState, 600);
                    }, 500);
                }, 400);
            }
        }

        function bossTurn() {
            const p2 = document.getElementById('p2');
            p2.classList.add('atk-boss');
            
            setTimeout(() => {
                cameraFx('shake');
                let d = Math.floor(Math.random() * (boss.dmg[1] - boss.dmg[0])) + boss.dmg[0];
                if(p.def) { d = Math.floor(d * 0.3); logMsg("¡Bloqueo exitoso!"); }
                
                p.hp -= d;
                spawnDmg('p1', d);
                document.getElementById('p1').classList.add('hit');
                updateUI();
                logMsg(`El Centinela ataca. Daño: ${d}`);

                setTimeout(() => {
                    p2.classList.remove('atk-boss');
                    document.getElementById('p1').classList.remove('hit');
                    setTimeout(() => { turn = true; checkState(); }, 400);
                }, 300);
            }, 200);
        }

        function checkState() {
            if(boss.hp <= 0) {
                logMsg(`¡${boss.n} DESTRUIDO!`);
                setTimeout(() => { lvl++; initLevel(); }, 1500);
            } else if (p.hp <= 0) {
                logMsg("SISTEMA CRÍTICO. HAS CAÍDO.");
                document.querySelector('.controls').innerHTML = `<button class="btn btn-ult" onclick="location.reload()">REINTENTAR</button>`;
            } else {
                if(!turn) setTimeout(bossTurn, 500); // Si el jugador atacó, sigue el jefe
                else setBtns(true); // Si el jefe atacó, turno del jugador
            }
        }

        // --- SISTEMA CEREBRO (PREGUNTAS) ---
        function openTrivia() {
            if(!turn) return;
            document.getElementById('m-q').innerText = boss.q;
            const b = document.getElementById('m-opts'); b.innerHTML = '';
            boss.o.forEach((op, i) => {
                const btn = document.createElement('button');
                btn.className = 'opt'; btn.innerText = op;
                btn.onclick = () => solveTrivia(i, boss.a);
                b.appendChild(btn);
            });
            document.getElementById('modal').classList.add('active');
        }

        function solveTrivia(sel, ans) {
            document.getElementById('modal').classList.remove('active');
            if(sel === ans) {
                logMsg("¡CONEXIÓN CEREBRO ESTABLECIDA! Poder Máximo.");
                p.ult = true; setBtns(true);
            } else {
                logMsg("ERROR DE SISTEMA. Retroceso neural.");
                p.hp -= 40; spawnDmg('p1', 40); cameraFx('shake'); updateUI();
                turn = false; setBtns(false);
                setTimeout(checkState, 1000);
            }
        }

        // Iniciar
        initLevel();
    </script>
</body>
</html>
