<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Men '97: Danger Room Protocol</title>
    
    <!-- Fuentes de cómic noventero -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Teko:wght@600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Paleta de colores X-Men '97 */
            --x-blue: #0044cc;
            --x-yellow: #ffcc00;
            --mutant-red: #e62e00;
            --sword-cyan: #00ffff;
            --sword-pink: #ff00ff;
            --sentinel-purple: #660099;
            --sentinel-pink: #cc0066;
            --ink-black: #0f0f0f;
            --ui-font: 'Teko', sans-serif;
            --comic-font: 'Bangers', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: #111; color: #fff;
            font-family: var(--ui-font); overflow: hidden;
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            /* Efecto CRT ligero para TV de los 90s */
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* --- ESCENARIO: LA SALA DE PELIGRO (DANGER ROOM) --- */
        .danger-room {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            background: linear-gradient(180deg, #001133 0%, #002266 100%);
            perspective: 1000px;
        }

        /* Cuadrícula Holográfica */
        .grid {
            position: absolute; bottom: -50%; left: -50%; width: 200%; height: 150%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.3) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.3) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: rotateX(70deg);
            animation: gridMove 5s linear infinite;
        }

        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 50px; } }

        /* Cintas de Precaución Clásicas de X-Men */
        .hazard-tape {
            position: absolute; bottom: 15vh; left: 0; width: 100%; height: 30px; z-index: 2;
            background: repeating-linear-gradient( 45deg, var(--x-yellow), var(--x-yellow) 20px, #000 20px, #000 40px );
            border-top: 4px solid var(--ink-black); border-bottom: 4px solid var(--ink-black);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* --- INTERFAZ TIPO ARCADE DE LOS 90S --- */
        .hud {
            position: relative; z-index: 10; display: flex; justify-content: space-between;
            padding: 15px 30px; background: rgba(0, 0, 0, 0.8);
            border-bottom: 4px solid var(--x-yellow);
        }

        .fighter-plate { width: 40%; display: flex; flex-direction: column; gap: 5px; }
        .enemy-plate { align-items: flex-end; }

        .name {
            font-family: var(--comic-font); font-size: 2.5rem; letter-spacing: 2px;
            text-transform: uppercase; text-shadow: 2px 2px 0 var(--ink-black), -1px -1px 0 var(--ink-black);
        }
        .hero-name { color: var(--x-yellow); }
        .boss-name { color: var(--sentinel-pink); }

        .hp-bar-bg {
            width: 100%; height: 35px; background: #222;
            border: 4px solid var(--ink-black); border-radius: 5px;
            position: relative; overflow: hidden; box-shadow: inset 0 5px 10px rgba(0,0,0,0.8);
        }

        .hp-fill {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transition: width 0.3s ease-out;
        }
        .player-hp { background: linear-gradient(180deg, #00ff00 0%, #009900 100%); }
        .enemy-hp { right: 0; left: auto; background: linear-gradient(180deg, #ff3300 0%, #990000 100%); }

        /* --- CAMPO DE BATALLA --- */
        .arena { flex: 1; position: relative; z-index: 5; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 18vh; }

        .avatar {
            position: absolute; bottom: 18vh; transition: 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: drop-shadow(10px 15px 5px rgba(0,0,0,0.6));
        }

        /* ANIMACIONES RESPIRATORIAS (Animación Tradicional) */
        .hero { left: 10%; width: 350px; height: 350px; animation: breathe 1.5s infinite alternate; }
        .boss { right: 5%; width: 500px; height: 500px; animation: breatheBoss 2s infinite alternate; }

        @keyframes breathe { 0% { transform: scaleY(1); } 100% { transform: scaleY(0.98) translateY(5px); } }
        @keyframes breatheBoss { 0% { transform: scaleY(1); } 100% { transform: scaleY(1.02) translateY(-10px); } }

        /* ANIMACIONES DE ATAQUE */
        .atk-hero { transform: translate(30vw, -30px) scale(1.1) rotate(15deg) !important; z-index: 20; }
        .atk-boss { transform: translate(-30vw, -50px) scale(1.1) !important; z-index: 20; }
        
        .hit { animation: flashHit 0.2s; filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5) !important; }
        @keyframes flashHit { 0% { transform: translate(0,0); } 25% { transform: translate(-20px, 0); } 75% { transform: translate(20px, 0); } 100% { transform: translate(0,0); } }

        /* ONOMATOPEYAS DE CÓMIC ("BAM!", "SLASH!") */
        .comic-pow {
            position: absolute; font-family: var(--comic-font); font-size: 6rem;
            color: #ffea00; text-shadow: 4px 4px 0 #ff0000, 8px 8px 0 #000;
            z-index: 50; pointer-events: none; transform: scale(0) rotate(-15deg);
            animation: powPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes powPop { 
            0% { transform: scale(0) rotate(-15deg); opacity: 0; } 
            50% { transform: scale(1.2) rotate(10deg); opacity: 1; } 
            100% { transform: scale(1) rotate(5deg); opacity: 0; margin-top: -50px; } 
        }

        /* --- PANEL DE CONTROLES X-MEN --- */
        .panel { 
            position: relative; z-index: 10; background: var(--x-blue); 
            border-top: 6px solid var(--x-yellow); display: flex;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }

        .log-container {
            width: 40%; background: #000; border-right: 4px solid var(--x-yellow);
            padding: 10px 20px; font-size: 1.5rem; color: #00ffff;
            display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
            font-family: var(--ui-font); text-shadow: 1px 1px 0 #000; line-height: 1.2;
        }

        .btn-grid { width: 60%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }

        .btn {
            background: #e6e6e6; border: 3px solid var(--ink-black); border-radius: 8px;
            color: var(--ink-black); padding: 15px; font-family: var(--comic-font); font-size: 1.8rem;
            cursor: pointer; transition: 0.1s; text-transform: uppercase;
            box-shadow: inset -3px -3px 0px rgba(0,0,0,0.3), 4px 4px 0px var(--ink-black);
        }
        .btn:active:not(:disabled) { box-shadow: inset 3px 3px 0px rgba(0,0,0,0.3), 0px 0px 0px var(--ink-black); transform: translate(4px, 4px); }
        .btn:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }
        
        .btn-atk { background: var(--mutant-red); color: #fff; }
        .btn-def { background: var(--x-yellow); color: var(--ink-black); }
        .btn-cerebro { grid-column: span 2; background: #00ccff; color: var(--ink-black); }
        .btn-ult { grid-column: span 2; background: #ff00ff; color: #fff; border-color: #fff; text-shadow: 2px 2px 0 #000; }

        /* --- MODAL (CEREBRO / PREGUNTAS) --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,20,0.9); display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.2s; z-index: 100;
        }
        .modal.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: var(--x-blue); border: 6px solid var(--x-yellow); padding: 40px;
            width: 90%; max-width: 800px; box-shadow: 20px 20px 0 rgba(0,0,0,0.5);
            border-radius: 10px;
        }
        .modal-title { font-family: var(--comic-font); color: var(--x-yellow); font-size: 3.5rem; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; }
        .modal-q { font-size: 2rem; margin-bottom: 20px; color: #fff; line-height: 1.1; }
        
        .opt-list { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            background: #fff; border: 3px solid var(--ink-black); color: var(--ink-black);
            padding: 15px 20px; font-family: var(--ui-font); font-size: 1.6rem;
            cursor: pointer; text-align: left; font-weight: bold; border-radius: 5px;
            box-shadow: 4px 4px 0 var(--ink-black); transition: 0.1s;
        }
        .opt-btn:hover { background: var(--x-yellow); transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink-black); }
        .hidden { display: none !important; }

        /* Estilo general para SVG: Líneas gruesas de cómic */
        svg { overflow: visible; }
        .ink { stroke: var(--ink-black); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    </style>
</head>
<body>

    <!-- ESCENARIO DANGER ROOM -->
    <div class="danger-room">
        <div class="grid"></div>
        <div class="hazard-tape"></div>
    </div>

    <!-- UI -->
    <div class="hud">
        <div class="fighter-plate">
            <div class="name hero-name">Joven Mutante</div>
            <div class="hp-bar-bg"><div id="p-hp" class="hp-fill player-hp"></div></div>
        </div>
        <div class="fighter-plate enemy-plate">
            <div id="e-name" class="name boss-name">Centinela MK-I</div>
            <div class="hp-bar-bg"><div id="e-hp" class="hp-fill enemy-hp"></div></div>
        </div>
    </div>

    <!-- CAMPO DE BATALLA (PERSONAJES ESTILO ANIMADO 90S) -->
    <main class="arena">
        
        <!-- EL HÉROE: Joven delgado, piel roja, traje azul/amarillo, cruz de oro, 2 espadas, cola, cuernos -->
        <div id="hero" class="avatar hero">
            <svg viewBox="0 0 300 300" width="100%" height="100%">
                <defs>
                    <!-- Brillo de las espadas -->
                    <filter id="swordGlowC"><feGaussianBlur stdDeviation="3" result="blur" /><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="swordGlowP"><feGaussianBlur stdDeviation="3" result="blur" /><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                </defs>

                <!-- COLA DEMONÍACA (Detrás del cuerpo) -->
                <path d="M 120 200 C 60 250 20 180 40 120 C 50 90 80 80 110 90 L 120 80 L 100 100 Z" fill="var(--mutant-red)" class="ink"/>
                <!-- Punta de la cola -->
                <path d="M 110 90 L 130 60 L 140 85 Z" fill="var(--mutant-red)" class="ink"/>

                <!-- ESPADA TRASERA (Magenta) -->
                <polygon points="100,160 20,40 35,30 115,150" fill="#fff" stroke="var(--sword-pink)" stroke-width="4" filter="url(#swordGlowP)"/>
                <rect x="95" y="145" width="30" height="10" fill="#333" class="ink" transform="rotate(-45 110 150)"/>
                <!-- Brazo trasero (Delgado, rojo) -->
                <path d="M 150 130 L 120 140 L 105 160" fill="none" class="ink"/>
                <path d="M 145 135 L 115 145 L 100 165" fill="none" class="ink"/>

                <!-- PIERNAS Y TRAJE (Delgado, ágil, agachado) -->
                <!-- Pierna Trasera -->
                <path d="M 150 200 L 130 250 L 150 280 L 170 280 L 160 250 Z" fill="var(--x-blue)" class="ink"/>
                <!-- Bota Trasera -->
                <path d="M 130 250 L 150 280 L 170 280 L 160 250 Z" fill="var(--x-yellow)" class="ink"/>

                <!-- Pierna Delantera -->
                <path d="M 170 200 L 200 240 L 190 290 L 220 290 L 220 240 Z" fill="var(--x-blue)" class="ink"/>
                <!-- Bota Delantera -->
                <path d="M 200 240 L 190 290 L 220 290 L 220 240 Z" fill="var(--x-yellow)" class="ink"/>

                <!-- TORSO (Joven, delgado, traje azul con arnés amarillo X-Men) -->
                <path d="M 140 120 C 130 160 140 200 160 210 C 180 200 190 160 180 120 Z" fill="var(--x-blue)" class="ink"/>
                <!-- Arnés Amarillo en X -->
                <path d="M 140 120 L 180 200 M 180 120 L 140 200" fill="none" stroke="var(--x-yellow)" stroke-width="12" class="ink"/>
                <!-- Hebilla con la X -->
                <circle cx="160" cy="160" r="15" fill="var(--mutant-red)" class="ink"/>
                <path d="M 153 153 L 167 167 M 167 153 L 153 167" fill="none" stroke="#fff" stroke-width="4"/>

                <!-- CRUZ DE ORO (Colgando del cuello sobre el pecho) -->
                <path d="M 150 110 C 155 130 165 130 170 110" fill="none" stroke="#ffcc00" stroke-width="2"/> <!-- Cadena -->
                <!-- La Cruz -->
                <rect x="158" y="125" width="4" height="15" fill="#ffcc00" class="ink" stroke-width="1"/>
                <rect x="153" y="130" width="14" height="4" fill="#ffcc00" class="ink" stroke-width="1"/>

                <!-- CABEZA (Piel carmesí, joven, cuernos, ojos blancos) -->
                <path d="M 145 70 C 145 50 175 50 175 70 L 180 100 L 160 115 L 140 100 Z" fill="var(--mutant-red)" class="ink"/>
                <!-- Pelo noventero revuelto/Sombra -->
                <path d="M 140 75 L 145 60 L 155 65 L 160 50 L 165 65 L 175 55 L 180 75 Z" fill="#000"/>
                <!-- Cuernos (Saliendo de la frente) -->
                <path d="M 150 65 L 140 40 L 155 55 Z" fill="#ddd" class="ink"/>
                <path d="M 170 65 L 180 40 L 165 55 Z" fill="#ddd" class="ink"/>
                <!-- Ojos Blancos (Estilo cómic, sin pupilas, cejas fruncidas) -->
                <polygon points="148,80 158,85 152,88" fill="#fff" class="ink" stroke-width="2"/>
                <polygon points="172,80 162,85 168,88" fill="#fff" class="ink" stroke-width="2"/>
                <!-- Boca (Mueca desafiante) -->
                <path d="M 155 100 Q 160 98 165 102" fill="none" stroke="#000" stroke-width="2"/>

                <!-- BRAZO DELANTERO Y ESPADA (Cyan) -->
                <path d="M 175 125 L 210 160 L 200 180" fill="none" class="ink" stroke-width="14" stroke="var(--mutant-red)"/>
                <!-- Guantelete amarillo -->
                <path d="M 195 155 L 215 175 L 205 185 L 185 165 Z" fill="var(--x-yellow)" class="ink"/>
                
                <!-- Espada Frontal (Apuntando al enemigo) -->
                <polygon points="200,175 290,110 295,125 210,185" fill="#fff" stroke="var(--sword-cyan)" stroke-width="4" filter="url(#swordGlowC)"/>
                <rect x="195" y="170" width="30" height="12" fill="#333" class="ink" transform="rotate(35 200 170)"/>
                <!-- Mano sosteniendo -->
                <circle cx="205" cy="180" r="10" fill="var(--mutant-red)" class="ink"/>

            </svg>
        </div>

        <!-- EL VILLANO: Centinela Gigante (Robot morado y rosa clásico) -->
        <div id="boss" class="avatar boss">
            <svg viewBox="0 0 400 400" width="100%" height="100%">
                <!-- Brazo trasero -->
                <path d="M 150 150 L 50 200 L 80 300 L 120 280 Z" fill="var(--sentinel-purple)" class="ink"/>
                <!-- Mano gigante -->
                <rect x="50" y="280" width="60" height="60" rx="10" fill="var(--sentinel-pink)" class="ink"/>

                <!-- Cuerpo Robot -->
                <path d="M 180 100 L 300 100 L 320 250 L 200 280 Z" fill="var(--sentinel-purple)" class="ink"/>
                <!-- Placas del pecho -->
                <path d="M 190 120 L 290 120 L 300 180 L 200 190 Z" fill="var(--sentinel-pink)" class="ink"/>
                <!-- Núcleo brillante -->
                <circle cx="250" cy="150" r="30" fill="var(--x-yellow)" class="ink"/>
                <circle cx="250" cy="150" r="15" fill="#fff"/>

                <!-- Cabeza de Centinela -->
                <path d="M 220 30 L 280 30 L 290 100 L 210 100 Z" fill="var(--sentinel-purple)" class="ink"/>
                <!-- Mandíbula -->
                <path d="M 215 80 L 285 80 L 275 120 L 225 120 Z" fill="var(--sentinel-pink)" class="ink"/>
                <!-- Ojos robóticos Amarillos -->
                <polygon points="230,50 250,55 235,65" fill="var(--x-yellow)" class="ink" stroke-width="2"/>
                <polygon points="270,50 250,55 265,65" fill="var(--x-yellow)" class="ink" stroke-width="2"/>
                <!-- Antenas -->
                <line x1="220" y1="50" x2="190" y2="20" class="ink" stroke-width="6"/>
                <line x1="280" y1="50" x2="310" y2="20" class="ink" stroke-width="6"/>

                <!-- Brazo Delantero -->
                <path d="M 280 150 L 380 220 L 340 320 L 280 280 Z" fill="var(--sentinel-purple)" class="ink"/>
                <!-- Puño frontal -->
                <rect x="310" y="300" width="70" height="70" rx="15" fill="var(--sentinel-pink)" class="ink"/>
                <line x1="330" y1="300" x2="330" y2="370" class="ink" stroke-width="3"/>
                <line x1="350" y1="300" x2="350" y2="370" class="ink" stroke-width="3"/>
            </svg>
        </div>
    </main>

    <!-- CONTROLES -->
    <div class="panel">
        <div id="log" class="log-container">
            <div>DANGER ROOM INICIADA.</div>
            <div>MUTANTE DETECTADO.</div>
        </div>
        <div class="btn-grid">
            <button id="btn-atk" class="btn btn-atk" onclick="attack(true)">Corte X</button>
            <button id="btn-def" class="btn btn-def" onclick="defend()">Bloqueo Ágil</button>
            <button id="btn-cer" class="btn btn-cerebro" onclick="openKnowledge()">CONEXIÓN CEREBRO</button>
            <button id="btn-ult" class="btn btn-ult hidden" onclick="ultimate()">¡MUTACIÓN MÁXIMA!</button>
        </div>
    </div>

    <!-- MODAL (ESTILO CEREBRO) -->
    <div id="modal" class="modal">
        <div class="modal-box">
            <h2 class="modal-title">SISTEMA CEREBRO: ARCHIVO GFPI</h2>
            <p id="modal-q" class="modal-q">Cargando base de datos mutante...</p>
            <div id="modal-opts" class="opt-list"></div>
        </div>
    </div>

    <script>
        // --- LÓGICA DEL JUEGO ---
        const MAX_HP = 300;
        let p = { hp: MAX_HP, def: false, ult: false };
        let stage = 0;
        let myTurn = true;

        const lore = [
            {
                n: "CENTINELA DE HARDWARE", hp: 400, dmg: [20, 35],
                t: { q: "Para hackear al Centinela, define: ¿Qué es el Software?", 
                     o: ["Los circuitos, cables y metal del robot.", "El conjunto de programas, instrucciones y reglas informáticas que lo controlan.", "La fuente de poder nuclear del pecho.", "El manual impreso de la máquina."], a: 1 }
            },
            {
                n: "MASTER MOLD", hp: 600, dmg: [40, 50],
                t: { q: "Intenta reescribir tus permisos. ¿Qué es una Licencia de Software?", 
                     o: ["Un contrato legal que dicta cómo puedes usar o modificar el programa.", "Un código de trucos para ser invencible.", "Un virus de computadora creado por Magneto.", "Un impuesto pagado al gobierno por usar internet."], a: 0 }
            },
            {
                n: "OMEGA SENTINEL", hp: 800, dmg: [50, 70],
                t: { q: "Elige tu bando en la guerra de licencias. ¿Cuáles son los dos tipos principales?", 
                     o: ["Rápidas y Lentas.", "Físicas y Virtuales.", "Software Libre (permite modificar y compartir) y Propietario (cerrado y restrictivo).", "Licencias Mutantes y Licencias Humanas."], a: 2 }
            },
            {
                n: "NIMROD DEL FUTURO", hp: 1200, dmg: [60, 90],
                t: { q: "Para salvar el futuro del código, ¿Qué tipo de licencia debes usar para que todos puedan colaborar libremente?", 
                     o: ["Software Propietario, para ocultar el código.", "Software Libre (como GNU GPL o MIT), para garantizar libertad de uso, estudio y modificación.", "Ninguna licencia, dejarlo sin protección.", "Licencia de Pago, para cobrarle a los demás."], a: 1 }
            }
        ];

        let e = null;

        function renderHP() {
            document.getElementById('p-hp').style.width = `${Math.max(0, (p.hp / MAX_HP) * 100)}%`;
            document.getElementById('e-hp').style.width = `${Math.max(0, (e.hp / e.mhp) * 100)}%`;
        }

        function log(msg) {
            const b = document.getElementById('log');
            b.innerHTML += `<div>> ${msg}</div>`;
            if (b.children.length > 4) b.removeChild(b.firstChild);
        }

        // Efectos de Cómic ("BAM!", "SLASH!")
        function spawnComicText(tar, isCrit) {
            const el = document.getElementById(tar);
            const r = el.getBoundingClientRect();
            const sp = document.createElement('div');
            sp.className = 'comic-pow';
            sp.innerText = isCrit ? "¡KRAK!" : (tar==='boss' ? "¡SLASH!" : "¡BAM!");
            sp.style.left = `${r.left + r.width/3}px`;
            sp.style.top = `${r.top + r.height/4}px`;
            document.body.appendChild(sp);
            setTimeout(() => sp.remove(), 600);
        }

        function init() {
            if(stage >= lore.length) {
                log("SIMULACIÓN COMPLETADA. EXCELENTE TRABAJO, X-MAN.");
                document.querySelector('.btn-grid').innerHTML = `<button class="btn btn-ult" onclick="location.reload()">REINICIAR SALA</button>`;
                return;
            }
            e = JSON.parse(JSON.stringify(lore[stage])); e.mhp = e.hp;
            document.getElementById('e-name').innerText = e.n;
            p.hp = MAX_HP; p.ult = false;
            btns(); renderHP();
            log(`NUEVO OBJETIVO: ${e.n}`);
        }

        function attack(isP) {
            if(isP && !myTurn) return;
            if(isP) { myTurn = false; p.def = false; btns(false); }

            const a = document.getElementById(isP ? 'hero' : 'boss');
            const t = document.getElementById(isP ? 'boss' : 'hero');
            a.classList.add(isP ? 'atk-hero' : 'atk-boss');

            setTimeout(() => {
                let d = 0;
                if(isP) {
                    d = Math.floor(Math.random() * 30) + 30; e.hp -= d;
                    log(`Corte doble! Daño: ${d}`);
                    spawnComicText('boss', false);
                } else {
                    d = Math.floor(Math.random() * (e.dmg[1] - e.dmg[0])) + e.dmg[0];
                    if(p.def) { d = Math.floor(d * 0.4); log("Bloqueaste con las espadas!"); }
                    p.hp -= d;
                    log(`El Centinela golpea. Daño: ${d}`);
                    spawnComicText('hero', false);
                }

                t.classList.add('hit'); renderHP();

                setTimeout(() => {
                    a.classList.remove('atk-hero', 'atk-boss');
                    t.classList.remove('hit');
                    setTimeout(() => loop(isP), 500);
                }, 200);
            }, 200);
        }

        function defend() {
            if(!myTurn) return;
            myTurn = false; p.def = true; btns(false);
            log("Postura defensiva lista.");
            setTimeout(() => attack(false), 800);
        }

        function ultimate() {
            if(!myTurn || !p.ult) return;
            myTurn = false; p.ult = false; btns(false);
            
            log("¡ATAQUE MÁXIMO LIBERADO!");
            
            // Efecto Flash Blanco
            const flash = document.createElement('div');
            flash.style = "position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:99;animation: fadeOut 1s forwards;";
            document.head.insertAdjacentHTML('beforeend', '<style>@keyframes fadeOut{to{opacity:0}}</style>');
            document.body.appendChild(flash);
            
            setTimeout(() => {
                const d = Math.floor(Math.random() * 200) + 250; e.hp -= d;
                spawnComicText('boss', true);
                document.getElementById('boss').classList.add('hit');
                renderHP();
                
                setTimeout(() => {
                    flash.remove();
                    document.getElementById('boss').classList.remove('hit');
                    setTimeout(() => loop(true), 600);
                }, 500);
            }, 300);
        }

        function loop(wasP) {
            if(e.hp <= 0) {
                log(`¡${e.n} DESTRUIDO!`);
                setTimeout(() => { stage++; init(); myTurn = true; }, 1500);
            } else if (p.hp <= 0) {
                log(`SISTEMA CRÍTICO. HAS SIDO DERROTADO.`);
                document.querySelector('.btn-grid').innerHTML = `<button class="btn btn-ult" onclick="location.reload()">REINTENTAR</button>`;
            } else {
                if(wasP) setTimeout(() => attack(false), 800);
                else { myTurn = true; btns(true); }
            }
        }

        function openKnowledge() {
            if(!myTurn) return;
            const t = e.t;
            document.getElementById('modal-q').innerText = t.q;
            const b = document.getElementById('modal-opts'); b.innerHTML = '';
            t.o.forEach((op, i) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn'; btn.innerText = op;
                btn.onclick = () => checkKnowledge(i, t.a);
                b.appendChild(btn);
            });
            document.getElementById('modal').classList.add('active');
        }

        function checkKnowledge(sel, ans) {
            document.getElementById('modal').classList.remove('active');
            if(sel === ans) {
                log("¡ENLACE CORRECTO! ENERGÍA MÁXIMA.");
                p.ult = true; btns(true);
            } else {
                log("ERROR DE DATOS. RECIBES DESCARGA NEURAL.");
                p.hp -= 40; spawnComicText('hero', false); renderHP();
                myTurn = false; btns(false);
                if(p.hp <= 0) setTimeout(() => loop(false), 500);
                else setTimeout(() => attack(false), 1500);
            }
        }

        function btns(en = null) {
            if(en !== null) document.querySelectorAll('.btn-grid .btn').forEach(b => b.disabled = !en);
            document.getElementById('btn-cer').classList.toggle('hidden', p.ult);
            document.getElementById('btn-ult').classList.toggle('hidden', !p.ult);
        }

        init();
    </script>
</body>
</html>
